# 운영: PostgreSQL 15+. 스키마는 DB 설계서의 DDL(axedu_schema.sql)로 만든다 (Hibernate 가 테이블을 만들지 않음).
# stringtype=unspecified: enum·enum[] 컬럼에 문자열을 그대로 넣을 수 있게 한다.
spring:
  datasource:
    url: ${AXEDU_DB_URL:jdbc:postgresql://localhost:5432/axedu?stringtype=unspecified}
    username: ${AXEDU_DB_USER:axedu}
    password: ${AXEDU_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 운영에서는 API 문서를 기본으로 끈다. 필요하면 AXEDU_SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${AXEDU_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${AXEDU_SWAGGER_ENABLED:false}
